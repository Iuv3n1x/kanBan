<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KanBan</title>

    <!-- Bindings -->
    <link rel="shortcut icon" href="/assets/img/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <script src="js/modal.js" defer></script>
    <script src="js/load.js" defer></script>
    <script src="js/eventListener.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <main class="app">
        <header class="topbar">
            <div class="title-wrapper">
                <h1 id="boardHeading">KanBan</h1>

                <button id="editBoardBtn" class="editBoardBtn" aria-label="Boead bearbeiten">
                    <span>✎</span>
                </button>
            </div>

            <div class="header-actions">

                <button class="options-button">
                    <span class="options-icon">⚙</span>
                    Optionen
                </button>

            </div>
        </header>

        <section class="board">
            <!-- Column 1 -->
            <article class="kanban-column">
                <div class="column-header column-blue">
                    <div class="column-title">
                        <h2 id="areaTitle_0">To Do</h2>
                        <span id="cardCount_0" class="card-count">3</span>
                    </div>

                    <div class="column-actions">
                        <button class="column-button editTitle" aria-label="Spalte bearbeiten">
                            ✎
                        </button>

                        <button class="column-button delete" aria-label="Spalte löschen">
                            ×
                        </button>
                    </div>
                </div>

                <div class="column-description" id="areaDescription_0">Aufgaben, die noch erleigt werden müssen.</div>

                <div class="cards" id="cards_0">

                    <div class="task-card finished">
                        <div class="task-content">
                            <span class="task-title">
                                Projekt erstellen
                            </span>
                        </div>
                    </div>

                </div>

                <div class="new-card">
                    <input class="areaInput" id="cardInput_0" type="text" placeholder="Neue Karte hinzufügen...">

                    <button class="add-card-button">
                        +
                    </button>
                </div>

            </article>

            <!-- Column 2 -->
            <article class="kanban-column">
                <div class="column-header column-purple">
                    <div class="column-title">
                        <h2 id="areaTitle_1">In Arbeit</h2>
                        <span id="cardCount_1" class="card-count">3</span>
                    </div>

                    <div class="column-actions">
                        <button class="column-button editTitle" aria-label="Spalte bearbeiten">
                            ✎
                        </button>

                        <button class="column-button delete" aria-label="Spalte löschen">
                            ×
                        </button>
                    </div>
                </div>

                <div class="column-description" id="areaDescription_1">Aufgaben, an denen gerade gearbeitet wird.</div>

                <div class="cards" id="cards_1">

                </div>

                <div class="new-card">
                    <input class="areaInput" id="cardInput_1" type="text" placeholder="Neue Karte hinzufügen...">

                    <button class="add-card-button">
                        +
                    </button>
                </div>

            </article>

            <!-- Column 3 -->
            <article class="kanban-column">
                <div class="column-header column-green">
                    <div class="column-title">
                        <h2 id="areaTitle_2">Fertig</h2>
                        <span id="cardCount_2" class="card-count">2</span>
                    </div>

                    <div class="column-actions">
                        <button class="column-button editTitle" aria-label="Spalte bearbeiten">
                            ✎
                        </button>

                        <button class="column-button delete" aria-label="Spalte löschen">
                            ×
                        </button>
                    </div>
                </div>

                <div class="column-description" id="areaDescription_2">Alles, was bereits abgeschlossen wurde.</div>

                <div class="cards" id="cards_2">

                </div>

                <div class="new-card">
                    <input class="areaInput" id="cardInput_2" type="text" placeholder="Neue Karte hinzufügen...">

                    <button class="add-card-button">
                        +
                    </button>
                </div>

            </article>
        </section>
    </main>

    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 id="modalTitle">Titel</h3>
            <p id="modalDescription" class="modal-desc"></p>

            <div id="modalInputsContainer" class="modal-inputs-container"></div>

            <div class="modal-actions">
                <button id="modalCancelBtn" class="modal-btn secondary">Abbrechen</button>
                <button id="modalConfirmBtn" class="modal-btn primary">Bestätigen</button>
            </div>
        </div>
    </div>

</body>

</html>
